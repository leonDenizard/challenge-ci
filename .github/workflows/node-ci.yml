name: Node.js CI

# Evento que dispara o Workflow

on:
  push:
    branches:
      - ci-workflow-test

# Lista de jobs a serem executadas

jobs:
  build:
    name: Build e teste node.js
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
   
    # Passos do job
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3 #clona o repositório para vm

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}} #Versão do node.js a ser usada

      - name: Iniciar projeto em node
        run: npm ci

      - name: Rodar testes
        run: npm test

    